name: Windows build and unit tests
on:
  workflow_dispatch:
  pull_request:
    paths: ['src/**', 'src-tauri/**', 'scripts/**', 'package*.json', '.github/workflows/windows-build.yml']
  push:
    paths: ['src/**', 'src-tauri/**', 'scripts/**', 'package*.json', '.github/workflows/windows-build.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Unit tests (no credentials or audio devices)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features
      - name: Build unsigned Windows installer
        run: npm run app:build:windows -- --ci
      - uses: actions/upload-artifact@v4
        with:
          name: Notely-Windows-x64-test-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
